# Release : à chaque tag vX.Y.Z (créé par npm run release), publie une
# release GitHub avec le zip d'installation snap-carousel-block-X.Y.Z.zip,
# qui contient le dossier snap-carousel-block/ et son build/ compilé
# (installé par config-local.ps1, étape github).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versions concordantes (tag, en-tête, readme, package.json)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(sed -n 's/^ \* Version: *//p' snap-carousel-block.php | tr -d '\r')
          STABLE=$(sed -n 's/^Stable tag: *//p' readme.txt | tr -d '\r')
          PACKAGE=$(node -p "require('./package.json').version")
          echo "tag $TAG, en-tête $HEADER, readme $STABLE, package.json $PACKAGE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$STABLE" ] || [ "$TAG" != "$PACKAGE" ]; then
            echo "::error::Versions désynchronisées : utiliser npm run release."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cœur WordPress pour les tests PHP (API HTML)
        run: curl -sSL https://wordpress.org/latest.tar.gz | tar -xz -C "$RUNNER_TEMP"

      - name: Tests
        run: npm test
        env:
          WP_CORE_DIR: ${{ runner.temp }}/wordpress

      - name: Le build/ versionné correspond aux sources
        run: |
          npm run build
          if ! git diff --quiet -- build; then
            echo "::warning::build/ diffère d'une compilation propre : vérifier qu'il a été recompilé avant la release."
            git diff --stat -- build
          fi
          git checkout -- build

      - name: Zip d'installation
        run: git archive --format=zip --prefix=snap-carousel-block/ -o "snap-carousel-block-${GITHUB_REF_NAME#v}.zip" HEAD

      - uses: softprops/action-gh-release@v2
        with:
          files: snap-carousel-block-*.zip
          generate_release_notes: true
